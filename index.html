<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>罗德岛智能排班系统</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#0a0a1a 0%,#1a1a3e 50%,#0d0d2b 100%);color:#e0e0e0;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh}
.page{max-width:600px;margin:0 auto;padding:30px 16px 60px}
.logo{text-align:center;margin-bottom:24px;position:relative}
.logo::before{content:'◇';position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:48px;color:#d4a843;opacity:.15}
.logo h1{color:#d4a843;font-size:22px;letter-spacing:3px;text-shadow:0 0 20px rgba(212,168,67,.2)}
.logo p{color:#666;font-size:12px;margin-top:4px;letter-spacing:1px}
.card{background:rgba(22,33,62,.85);border-radius:12px;border:1px solid rgba(42,58,94,.6);padding:24px;margin-bottom:14px;backdrop-filter:blur(10px)}
.card h2{font-size:14px;color:#d4a843;margin-bottom:12px;display:flex;align-items:center;gap:8px;letter-spacing:.5px}
.steps{background:rgba(15,22,41,.6);border-radius:8px;padding:12px 14px;font-size:12.5px;color:#bbb;line-height:1.8;margin-bottom:14px;border:1px solid rgba(42,58,94,.3)}
.steps strong{color:#d4a843}
.steps code{display:block;background:#0a0a1a;padding:8px 10px;border-radius:6px;font-size:11.5px;color:#6bb5ff;word-break:break-all;margin:6px 0;border:1px solid rgba(42,58,94,.3)}
.steps a{color:#6bb5ff;text-decoration:none}
.steps a:hover{text-decoration:underline}
label{display:block;font-size:12px;color:#888;margin-bottom:5px;letter-spacing:.5px}
input{width:100%;padding:10px 14px;background:rgba(15,22,41,.8);border:1px solid rgba(42,58,94,.5);border-radius:8px;color:#e0e0e0;font-size:13px;outline:none;transition:all .2s}
input:focus{border-color:rgba(212,168,67,.5);box-shadow:0 0 12px rgba(212,168,67,.08)}
.btn{width:100%;padding:11px;border:none;border-radius:8px;font-size:13px;cursor:pointer;transition:all .2s;margin-top:4px;letter-spacing:1px}
.btn-primary{background:linear-gradient(135deg,#d4a843,#c49430);color:#0a0a1a;font-weight:700}
.btn-primary:hover{opacity:.92;transform:translateY(-1px);box-shadow:0 4px 16px rgba(212,168,67,.25)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.status{padding:10px 14px;border-radius:6px;font-size:12.5px;margin-top:10px;display:none;animation:fadeIn .3s}
.status.error{display:block;background:rgba(61,26,26,.7);border:1px solid rgba(107,42,42,.5);color:#ff6b6b}
.status.success{display:block;background:rgba(26,61,26,.7);border:1px solid rgba(42,107,42,.5);color:#5ddf5d}
.status.info{display:block;background:rgba(26,42,61,.7);border:1px solid rgba(42,74,107,.5);color:#6bb5ff}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(10,10,26,.3);border-top-color:#0a0a1a;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.result{display:none;margin-top:12px;animation:fadeIn .4s}
.result.show{display:block}
.pre-wrap{background:rgba(15,22,41,.6);padding:10px;border-radius:6px;font-size:11px;color:#6bb5ff;overflow-x:auto;max-height:140px;border:1px solid rgba(42,58,94,.3)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat-item{background:rgba(15,22,41,.6);border-radius:8px;padding:12px 8px;text-align:center;border:1px solid rgba(42,58,94,.3)}
.stat-num{font-size:22px;font-weight:700;color:#d4a843}
.stat-label{font-size:10.5px;color:#777;margin-top:2px;letter-spacing:.5px}
.table-wrap{max-height:320px;overflow-y:auto;border-radius:8px;border:1px solid rgba(42,58,94,.3)}
.table-wrap::-webkit-scrollbar{width:4px}
.table-wrap::-webkit-scrollbar-track{background:transparent}
.table-wrap::-webkit-scrollbar-thumb{background:rgba(212,168,67,.3);border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 10px;background:rgba(15,22,41,.8);color:#d4a843;font-weight:600;position:sticky;top:0;z-index:1;border-bottom:1px solid rgba(42,58,94,.5);letter-spacing:.5px}
td{padding:7px 10px;border-bottom:1px solid rgba(42,58,94,.15)}
tr:hover td{background:rgba(212,168,67,.04)}
.rarity6{color:#ff6b35;font-weight:600}.rarity5{color:#d4a843}.rarity4{color:#aa88ff}.rarity3{color:#88ccff}.rarity2{color:#88dd88}.rarity1{color:#aaa}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;margin-left:4px;vertical-align:middle}
.tag-6{background:rgba(255,107,53,.15);color:#ff6b35}
.tag-5{background:rgba(212,168,67,.15);color:#d4a843}
.tag-4{background:rgba(170,136,255,.15);color:#aa88ff}
.tag-3{background:rgba(136,204,255,.15);color:#88ccff}
.tag-2{background:rgba(136,221,136,.15);color:#88dd88}
.tag-1{background:rgba(170,170,170,.15);color:#aaa}
.elite-badge{display:inline-block;padding:1px 5px;border-radius:3px;font-size:10px;background:rgba(42,58,94,.4);color:#888}
.shift-tabs{display:flex;gap:6px;margin-bottom:10px}
.shift-tab{padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer;background:rgba(15,22,41,.6);border:1px solid rgba(42,58,94,.3);color:#888;transition:all .2s}
.shift-tab.active{background:rgba(212,168,67,.15);border-color:rgba(212,168,67,.4);color:#d4a843}
.facility-card{background:rgba(15,22,41,.6);border-radius:8px;padding:10px;margin-bottom:8px;border:1px solid rgba(42,58,94,.3)}
.facility-card h4{font-size:12px;color:#d4a843;margin-bottom:6px}
.facility-card .slot{display:flex;align-items:center;gap:6px;padding:3px 6px;margin:2px 0;font-size:11px;border-radius:4px}
.facility-card .slot .name{flex:1;color:#e0e0e0}
.facility-card .slot .eff{color:#6bb5ff;font-size:10px}
.facility-card .slot .eff-good{color:#5ddf5d}
.eff-total{text-align:center;font-size:13px;color:#d4a843;padding:8px;margin-top:8px;background:rgba(212,168,67,.06);border-radius:6px}
.footer{text-align:center;font-size:11px;color:#555;margin-top:32px;letter-spacing:.5px}
</style>
</head>
<body>
<div class="page">
  <div class="logo">
    <h1>◇ 罗德岛智能排班系统</h1>
    <p>基于森空岛 API · 数据本地存储</p>
  </div>
  
  <div class="card">
    <h2>🔐 登录</h2>
    <div class="steps">
      <strong>一步获取凭证</strong><br>
      1. 打开 <a href="https://www.skland.com" target="_blank" style="color:#5398ff">森空岛官网</a> 并登录<br>
      2. F12 → Console → 粘贴以下命令回车：<br>
      <code>copy(localStorage.getItem('SK_OAUTH_CRED_KEY'))</code>
      3. 回到本页粘贴到下方输入框（兼容 "cred,token" 格式，token 可省略，省略时自动获取）
    </div>
    <label>Credential</label>
    <input id="credInput" placeholder="粘贴从森空岛复制的 cred"/>
    <button id="loginBtn" class="btn btn-primary" type="button">获取干员数据</button>
    <div id="status" class="status"></div>
  </div>
  
  <div id="resultCard" class="card result">
    <h2>📊 数据概览</h2>
    <div id="stats" class="stat-grid"></div>
    <h2 style="margin-top:14px">🧑‍✈️ 干员列表</h2>
    <div class="table-wrap" id="tableWrap"></div>
  </div>
  
<div id="scheduleCard" class="card">
  <h2>📋 智能排班</h2>
  <div class="mf-config" id="mfConfig" style="margin-bottom:10px">
    <div style="font-size:11px;color:#888;margin-bottom:4px">🏭 制造站产物配置（点击切换）</div>
    <div id="mfConfigRow" style="display:flex;gap:4px;flex-wrap:wrap"></div>
  </div>
  <button id="scheduleBtn" class="btn btn-primary" type="button">⚡ 生成排班表</button>
    <div id="scheduleResult"></div>
  </div>
  <div class="footer">数据仅存于本地浏览器 · 罗德岛智能排班系统</div>
</div>

<script>
// ===== 森空岛 API（2026-08 从官方 web 端逆向确认的现行协议）=====
// 1. GET zonai.skland.com/web/v1/auth/refresh （header: cred）→ data.token（签名 token）
// 2. 业务请求需签名：sign = md5(hmacSHA256(path + (GET?query:body) + timestamp +
//    JSON.stringify({platform:'3', timestamp, dId, vName}), token))
// 3. zonai.skland.com 允许浏览器跨域（ACAO: *），GitHub Pages 直连可用；
//    CF Pages / 本地开发走仓库内 functions 代理（/api/sw、/api/sk）
const SKLAND = 'https://zonai.skland.com'

function apiUrl(url) {
  const h = location.hostname
  const onCf = h.includes('pages.dev') || h === 'localhost' || h === '127.0.0.1'
  if (!onCf) return url
  if (url.startsWith(SKLAND + '/web')) return '/api/sw' + url.slice(SKLAND.length + 4)
  return '/api/sk' + url.slice(SKLAND.length + 4)
}

function getDId() {
  let id = localStorage.getItem('ak_did')
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : 'web-' + Math.random().toString(16).slice(2) + Date.now().toString(16))
    localStorage.setItem('ak_did', id)
  }
  return id
}

async function hmacSHA256Hex(key, msg) {
  const enc = new TextEncoder()
  const keyBuf = await crypto.subtle.importKey('raw', enc.encode(key), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign'])
  const sig = await crypto.subtle.sign('HMAC', keyBuf, enc.encode(msg))
  return Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2, '0')).join('')
}

// 标准 MD5（RFC 1321），已用测试向量验证
function md5(s) {
  const HEX = '0123456789abcdef'
  const T = [0xd76aa478,0xe8c7b756,0x242070db,0xc1bdceee,0xf57c0faf,0x4787c62a,0xa8304613,0xfd469501,0x698098d8,0x8b44f7af,0xffff5bb1,0x895cd7be,0x6b901122,0xfd987193,0xa679438e,0x49b40821,0xf61e2562,0xc040b340,0x265e5a51,0xe9b6c7aa,0xd62f105d,0x02441453,0xd8a1e681,0xe7d3fbc8,0x21e1cde6,0xc33707d6,0xf4d50d87,0x455a14ed,0xa9e3e905,0xfcefa3f8,0x676f02d9,0x8d2a4c8a,0xfffa3942,0x8771f681,0x6d9d6122,0xfde5380c,0xa4beea44,0x4bdecfa9,0xf6bb4b60,0xbebfbc70,0x289b7ec6,0xeaa127fa,0xd4ef3085,0x04881d05,0xd9d4d039,0xe6db99e5,0x1fa27cf8,0xc4ac5665,0xf4292244,0x432aff97,0xab9423a7,0xfc93a039,0x655b59c3,0x8f0ccc92,0xffeff47d,0x85845dd1,0x6fa87e4f,0xfe2ce6e0,0xa3014314,0x4e0811a1,0xf7537e82,0xbd3af235,0x2ad7d2bb,0xeb86d391]
  const S = [[7,12,17,22],[5,9,14,20],[4,11,16,23],[6,10,15,21]]
  const enc = new TextEncoder()
  const bytes = enc.encode(s)
  const l = bytes.length
  const words = (((l + 8) >> 6) + 1) * 16
  const X = new Uint32Array(words)
  for (let i = 0; i < l; i++) X[i >> 2] |= (bytes[i] & 255) << ((i % 4) * 8)
  X[l >> 2] |= 0x80 << ((l % 4) * 8)
  X[words - 2] = (l * 8) >>> 0
  X[words - 1] = Math.floor(l / 0x100000000)
  const rotl = (v, n) => (v << n) | (v >>> (32 - n))
  let a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476
  for (let i = 0; i < words; i += 16) {
    let A = a0, B = b0, C = c0, D = d0
    for (let j = 0; j < 64; j++) {
      let f, g, s
      if (j < 16)      { f = (B & C) | (~B & D);          g = j;                s = S[0][j % 4] }
      else if (j < 32) { f = (D & B) | (~D & C);          g = (5 * j + 1) % 16; s = S[1][j % 4] }
      else if (j < 48) { f = B ^ C ^ D;                   g = (3 * j + 5) % 16; s = S[2][j % 4] }
      else             { f = C ^ (B | ~D);                g = (7 * j) % 16;    s = S[3][j % 4] }
      const tmp = D
      D = C
      C = B
      B = (B + rotl((A + f + X[i + g] + T[j]) | 0, s)) | 0
      A = tmp
    }
    a0 = (a0 + A) >>> 0; b0 = (b0 + B) >>> 0; c0 = (c0 + C) >>> 0; d0 = (d0 + D) >>> 0
  }
  let r = ''
  for (const v of [a0, b0, c0, d0]) {
    for (let i = 0; i < 4; i++) { const byte = (v >>> (i * 8)) & 255; r += HEX[(byte >> 4) & 15] + HEX[byte & 15] }
  }
  return r
}

// 与官方 web 端一致的签名
async function computeSign(path, query, method, body, ts, token) {
  const headers = { platform: '3', timestamp: ts, dId: getDId(), vName: '1.0.0' }
  let text = path
  text += method === 'GET' ? (query || '') : (body || '')
  text += ts
  text += JSON.stringify(headers)
  const hmacHex = await hmacSHA256Hex(token, text)
  return { sign: md5(hmacHex), ...headers }
}

async function api(url, headers) {
  const r = await fetch(url, { headers })
  const t = await r.text()
  try { return JSON.parse(t) } catch { return { code: -1, message: t.slice(0, 200) } }
}

async function refreshToken(cred) {
  const r = await api(apiUrl(SKLAND + '/web/v1/auth/refresh'), { cred })
  if (r.code !== 0) throw new Error('刷新token失败: ' + (r.message || r.code))
  return r.data?.token
}

async function signedApi(path, query, cred, token) {
  const ts = Math.floor(Date.now() / 1000).toString()
  const sig = await computeSign(path, query, 'GET', '', ts, token)
  const url = apiUrl(SKLAND + path + (query ? '?' + query : ''))
  return api(url, { cred, sign: sig.sign, timestamp: sig.timestamp, dId: sig.dId, platform: sig.platform, vName: sig.vName })
}

function showStatus(type, msg) {
  const el = document.getElementById('status')
  el.className = 'status ' + type
  el.innerHTML = msg
}

async function login() {
  const btn = document.getElementById('loginBtn')
  let cred = document.getElementById('credInput').value.trim()
  if (!cred) { showStatus('error', '请输入credential'); return }
  // 兼容 "cred,token" 格式（token 可省略，省略时自动用 cred 换取）
  let token = ''
  if (cred.includes(',')) { const parts = cred.split(','); cred = parts[0].trim(); token = (parts[1] || '').trim() }

  btn.disabled = true
  btn.innerHTML = '<span class="spinner"></span>获取中...'

  try {
    if (!token) {
      showStatus('info', '正在获取签名token...')
      token = await refreshToken(cred)
      if (!token) throw new Error('刷新token失败: 响应缺少 token')
    }
    localStorage.setItem('ak_token', token)

    showStatus('info', '正在获取账号绑定...')
    const r2 = await signedApi('/api/v1/game/player/binding', '', cred, token)
    if (r2.code !== 0) throw new Error('获取绑定失败: ' + (r2.message || r2.code))

    let uid = '0', nick = ''
    for (const a of (r2.data?.list || [])) {
      if (a.appCode === 'arknights') {
        uid = a.bindingList[0].uid
        nick = a.bindingList[0].nickName || ''
        break
      }
    }
    if (uid === '0') throw new Error('未找到明日方舟角色绑定')
    showStatus('info', 'UID: ' + uid)

    const r3 = await signedApi('/api/v1/game/player/info', 'uid=' + uid, cred, token)
    if (r3.code !== 0) throw new Error('获取数据失败: ' + (r3.message || r3.code))

    const d = r3.data
    const chars = d.chars || []
    const building = d.building || {}
    const charInfoMap = d.charInfoMap || {}

    showStatus('success', '✅ 获取成功！' + chars.length + '名干员')

    // 统计
    const stats = document.getElementById('stats')
    stats.innerHTML = '' +
      '<div class="stat-item"><div class="stat-num">' + chars.length + '</div><div class="stat-label">干员</div></div>' +
      '<div class="stat-item"><div class="stat-num">' + (d.status?.level || '?') + '</div><div class="stat-label">博士等级</div></div>' +
      '<div class="stat-item"><div class="stat-num">' + ((building.manufactures || []).length) + '</div><div class="stat-label">制造站</div></div>'

    // 干员表格
    let html = '<table><thead><tr><th>名字</th><th>星级</th><th>等级</th><th>精英</th></tr></thead><tbody>'
    for (const c of chars) {
      const id = c.id || c.charId
      const info = charInfoMap[id]
      const name = info?.name || id
      const rarity = c.rarity || info?.rarity || 1
      const cls = 'rarity' + rarity
      const tagCls = 'tag tag-' + rarity
      html += '<tr><td class="' + cls + '">' + name + '</td>' +
        '<td><span class="' + tagCls + '">★' + rarity + '</span></td>' +
        '<td>' + (c.level || '?') + '</td>' +
        '<td><span class="elite-badge">' + ('精英' + (c.evolvePhase || 0)) + '</span></td></tr>'
    }
    html += '</tbody></table>'
    document.getElementById('tableWrap').innerHTML = html
    document.getElementById('resultCard').classList.add('show')
    document.getElementById('scheduleCard').classList.add('show')

    // 存数据
    localStorage.setItem('ak_user_data', JSON.stringify({
      nickname: d.status?.name || nick || '博士',
      level: d.status?.level || 0,
      uid,
      chars: chars.map(c => {
        const id = c.id || c.charId
        const info = charInfoMap[id]
        return {
          charId: id,
          name: info?.name || id,
          rarity: c.rarity || info?.rarity || 1,
          level: c.level || 1,
          elite: c.evolvePhase || 0,
          potential: Math.ceil((c.potentialRank || 0) + 1),
          own: true,
        }
      }),
      building: {
        manufactures: building.manufactures || [],
        tradings: building.tradings || [],
        dormitories: building.dormitories || [],
        powers: building.powers || [],
        meeting: building.meeting || null,
        training: building.training || null,
        tiredChars: building.tiredChars || [],
        labor: building.labor || {},
      },
      charInfoMap: Object.fromEntries(Object.entries(charInfoMap).map(([k, v]) => [k, { name: v.name, rarity: v.rarity }])),
    }))

    // 首次登录按实际制造站数量初始化产物配置
    if (!localStorage.getItem('ak_mf_config')) refreshMfConfig(Math.max((building.manufactures || []).length, 2))

  } catch (e) {
    showStatus('error', '❌ ' + e.message)
    console.error(e)
  } finally {
    btn.disabled = false
    btn.innerHTML = '获取干员数据'
  }
}

// ===== 排班算法 v3 （全设施去重+制造配置）=====
let ctrlOps = {}
const FACILITY_CFG = {
  manufacture: { label: '制造站', slots: 3, moodCost: 0.75 },
  trading:     { label: '贸易站', slots: 3, moodCost: 0.75 },
  power:       { label: '发电站', slots: 2, moodCost: 0.75 },
  meeting:     { label: '会客室', slots: 2, moodCost: 0.5 },
  training:    { label: '训练室', slots: 1, moodCost: 0.3 },
  control:     { label: '控制中心', slots: 5, moodCost: 0.5 },
}
function classifyMF(d) { if (!d) return '通用'; if (d.includes('源石')) return '源石碎片'; if (d.includes('贵金属') || d.includes('赤金')) return '赤金'; if (d.includes('作战记录')) return '作战记录'; if (d.includes('技巧概要')) return '技巧概要'; return '通用' }
let baseSkillsCache = null
async function loadBaseSkills() { if (baseSkillsCache) return baseSkillsCache; const r = await fetch('data/baseSkills.json'); baseSkillsCache = await r.json(); return baseSkillsCache }
function analyzeSkills(chars, skills) { return (chars || []).map(c => { const sd = skills[c.charId]; if (!sd) return { ...c, baseSkills: {} }; const fac = {}, moods = [], combos = [], partners = []; let mfCat = null
  for (const [f, info] of Object.entries(sd)) { if (['name', 'rarity'].includes(f)) continue; const d = info.desc || ''; fac[f] = { type: info.type || '', value: info.value || 0, desc: d }
  if (d.includes('心情每小时消耗')) { const m = d.match(/心情每小时消耗([+-])([\d.]+)/); if (m) moods.push({ facility: f, cost: parseFloat(m[1] + m[2]) }) }
  if (f !== 'dormitory' && (d.includes('若') || d.includes('当') || d.includes('如果') || d.includes('同个') || d.includes('额外'))) { combos.push({ facility: f, desc: d.slice(0, 80) })
    const ms = d.matchAll(/([^\s<]+)(?:进驻|在|与|和|入驻)/g); for (const m of ms) if (m[1].length > 1) partners.push(m[1]) }
  if (f === 'manufacture') mfCat = classifyMF(d) }
  return { ...c, rarity: sd.rarity || c.rarity || 1, baseSkills: fac, mfCat, moods, combos, partners: [...new Set(partners)] } }) }
function pickMF(type, pool, count, cat, used) { const a = pool.filter(o => o.baseSkills && o.baseSkills[type] && o.mfCat === cat && !used.has(o.charId)).sort((a, b) => b.baseSkills[type].value - a.baseSkills[type].value)
  const b = pool.filter(o => o.baseSkills && o.baseSkills[type] && o.mfCat !== cat && !used.has(o.charId)).sort((a, b) => b.baseSkills[type].value - a.baseSkills[type].value)
  const r = []; let e = 0
  for (const l of [a, b]) { for (const o of l) { if (r.length >= count) break; used.add(o.charId); r.push({ charId: o.charId, name: o.name, rarity: o.rarity, skill: o.baseSkills[type], moodCost: o.moods?.find(m => m.facility === type) }); e += o.baseSkills[type]?.value || 0 } }
  for (const o of pool) { if (r.length >= count) break; if (used.has(o.charId)) continue; used.add(o.charId); r.push({ charId: o.charId, name: o.name, rarity: o.rarity, skill: { type: 'general', value: 0, desc: '通用' } }) }
  while (r.length < count) r.push({ charId: 'empty_' + r.length, name: '空位', rarity: 1, skill: { type: 'empty', value: 0, desc: '待分配' } }); return { assigned: r, efficiency: e } }
function pickFac(type, pool, count, used) { if (type === 'control') { const sorted = [...pool].sort((a, b) => { const aS = (ctrlOps[a.charId]?.score || 0), bS = (ctrlOps[b.charId]?.score || 0); if (aS !== bS) return bS - aS
  const aC = a.combos?.length || 0, bC = b.combos?.length || 0; if (aC !== bC) return bC - aC; return b.rarity - a.rarity }); return pickGeneric(sorted, count) }
  const u = used || new Set(); const a = pool.filter(o => o.baseSkills && o.baseSkills[type] && !u.has(o.charId)).sort((a, b) => b.baseSkills[type].value - a.baseSkills[type].value)
  const r = []; let e = 0
  for (const o of a) { if (r.length >= count) break; if (u.has(o.charId)) continue; u.add(o.charId); r.push({ charId: o.charId, name: o.name, rarity: o.rarity, skill: o.baseSkills[type], moodCost: o.moods?.find(m => m.facility === type) }); e += o.baseSkills[type]?.value || 0 }
  for (const o of pool) { if (r.length >= count) break; if (u.has(o.charId)) continue; u.add(o.charId); r.push({ charId: o.charId, name: o.name, rarity: o.rarity, skill: { type: 'general', value: 0, desc: '通用' }, moodCost: null }) }
  while (r.length < count) r.push({ charId: 'empty_' + r.length, name: '空位', rarity: 1, skill: { type: 'empty', value: 0, desc: '待分配' }, moodCost: null }); return { assigned: r, efficiency: e } }
function pickGeneric(pool, count) { const u = new Set(), r = []; let e = 0
  for (const o of pool) { if (r.length >= count) break; if (u.has(o.charId)) continue; u.add(o.charId); r.push({ charId: o.charId, name: o.name, rarity: o.rarity, skill: { type: 'general', value: 0, desc: '通用' }, moodCost: null }); e += 0 }
  for (const o of pool) { if (r.length >= count) break; if (u.has(o.charId)) continue; u.add(o.charId); r.push({ charId: o.charId, name: o.name, rarity: o.rarity, skill: { type: 'general', value: 0, desc: '通用' }, moodCost: null }) }
  while (r.length < count) r.push({ charId: 'empty_' + r.length, name: '空位', rarity: 1, skill: { type: 'empty', value: 0, desc: '待分配' }, moodCost: null }); return { assigned: r, efficiency: e } }
function generateSchedule(ud, skills) { const chars = analyzeSkills(ud.chars || [], skills), bld = ud.building || {}
  const mfC = Math.max((bld.manufactures || []).length, 2), trC = Math.max((bld.tradings || []).length, 1)
  const savedCfg = JSON.parse(localStorage.getItem('ak_mf_config') || 'null')
  const defaultCats = ['赤金', '作战记录', '源石碎片', '通用', '赤金']
  const cats = savedCfg || defaultCats
  const scs = []; for (let s = 0; s < 2; s++) { const pool = [...chars], off = Math.floor(pool.length / 2) * s, rot = [...pool.slice(off), ...pool.slice(0, off)]
    const fs = {}; let te = 0, ctrlBonus = 0; const used = new Set()
    fs.control = pickFac('control', chars, 5)
    for (const o of fs.control.assigned || []) { const cb = ctrlOps[o.charId]; if (!cb) continue
      for (const bf of cb.buffs || []) { const d = bf.desc || ''
        if (d.includes('所有制造站生产力')) { const m = d.match(/[\d.]+(?=%)/); if (m) ctrlBonus += parseFloat(m[0]) }
        if (d.includes('所有贸易站订单效率')) { const m = d.match(/[\d.]+(?=%)/); if (m) ctrlBonus += parseFloat(m[0]) }
      }
    }
    fs.manufacture = []; for (let m = 0; m < mfC; m++) { const r = pickMF('manufacture', rot, 3, cats[m] || '通用', used); r.label = `制造站${m + 1}(${cats[m] || '通用'})`; r.ctrlBonus = ctrlBonus; te += r.efficiency }
    fs.trading = []; for (let t = 0; t < trC; t++) { const r = pickFac('trading', rot, 3, used); r.label = `贸易站${t + 1}`; r.ctrlBonus = ctrlBonus; te += r.efficiency }
    // 贸易站联动配对：把搭档换到同一站（放到空位/通用位），使组合效果生效
    if (fs.trading.length > 1) { for (let a = 0; a < fs.trading.length; a++) { for (let b = a + 1; b < fs.trading.length; b++) {
      for (const oa of fs.trading[a].assigned) { for (const ob of fs.trading[b].assigned) {
        if (oa.partners?.includes(ob.name) || ob.partners?.includes(oa.name)) {
          const idxB = fs.trading[b].assigned.indexOf(ob)
          const idxA = fs.trading[a].assigned.findIndex(o => o.skill.type === 'general' || o.skill.type === 'empty')
          if (idxA >= 0 && idxB >= 0) { const tmp = fs.trading[a].assigned[idxA]; fs.trading[a].assigned[idxA] = fs.trading[b].assigned[idxB]; fs.trading[b].assigned[idxB] = tmp }
    } } } } } }
    fs.power = []; for (let p = 0; p < 2; p++) { const r = pickFac('power', rot, 2, used); r.label = `发电站${p + 1}`; fs.power.push(r); te += r.efficiency }
    fs.meeting = pickFac('meeting', rot, 2, used); fs.training = pickFac('training', rot, 1, used)
    let tm = 0; for (const [f, d] of Object.entries(fs)) { const list = Array.isArray(d) ? d : [d]; for (const i of list) { const ops = i.assigned || [i]; for (const o of ops) if (o.moodCost) tm += o.moodCost.cost } }
    scs.push({ shift: s + 1, label: ['A班', 'B班'][s], facilities: fs, efficiency: te, moodCost: tm, ctrlBonus }) }
  return { schedules: scs, totalEfficiency: scs.reduce((s, x) => s + x.efficiency, 0) } }
async function runSchedule() { const btn = document.getElementById('scheduleBtn'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>计算中...'
  try { const raw = localStorage.getItem('ak_user_data'); if (!raw) { alert('请先获取干员数据'); return }
    const ud = JSON.parse(raw), skills = await loadBaseSkills(), ctrlResp = await fetch('data/ctrl_skills.json'); ctrlOps = await ctrlResp.json(), result = generateSchedule(ud, skills)
    let h = '<div class="shift-tabs">'; for (const s of result.schedules) h += `<div class="shift-tab active" onclick="showShift(this,'shift${s.shift}')">${s.label}</div>`
    h += '</div>'
    for (const s of result.schedules) { h += `<div id="shift${s.shift}" style="display:${s.shift === 1 ? 'block' : 'none'}">`
      h += `<div class="facility-card"><h4>🏛️ 控制中心</h4>`; for (const o of (s.facilities.control?.assigned || [])) { const cb = ctrlOps[o.charId]; const desc = cb ? cb.buffs[0]?.desc || '' : ''; h += `<div class="slot"><span class="name">${o.name}</span><span class="eff-good">${desc || '通用'}</span></div>` } h += `</div>`
      for (const mf of (s.facilities.manufacture || [])) { h += `<div class="facility-card"><h4>🏭 ${mf.label}</h4>`; for (const o of (mf.assigned || [])) { const c = o.skill.value > 0 ? 'eff-good' : 'eff'; const mood = o.moodCost ? ` 💚${o.moodCost.cost > 0 ? '+' : ''}${o.moodCost.cost}` : ''; h += `<div class="slot"><span class="name">${o.name}</span><span class="${c}">${o.skill.desc || ''}${mood}</span></div>` } h += `<div class="eff-total" style="padding:4px;font-size:11px">效率: ${mf.efficiency.toFixed(1)}${mf.ctrlBonus > 0 ? '+中枢' + mf.ctrlBonus + '%' : ''}</div></div>` }
      for (const tr of (s.facilities.trading || [])) { h += `<div class="facility-card"><h4>🏪 ${tr.label}</h4>`; for (const o of (tr.assigned || [])) { const c = o.skill.value > 0 ? 'eff-good' : 'eff'; h += `<div class="slot"><span class="name">${o.name}</span><span class="${c}">${o.skill.desc || ''}</span></div>` } h += `<div class="eff-total" style="padding:4px;font-size:11px">效率: ${tr.efficiency.toFixed(1)}</div></div>` }
      for (const pw of (s.facilities.power || [])) { h += `<div class="facility-card"><h4>⚡ ${pw.label}</h4>`; for (const o of (pw.assigned || [])) { const c = o.skill.value > 0 ? 'eff-good' : 'eff'; h += `<div class="slot"><span class="name">${o.name}</span><span class="${c}">${o.skill.desc || ''}</span></div>` } h += `<div class="eff-total" style="padding:4px;font-size:11px">效率: ${pw.efficiency.toFixed(1)}</div></div>` }
      if (s.facilities.meeting?.assigned) { h += `<div class="facility-card"><h4>🤝 会客室</h4>`; for (const o of s.facilities.meeting.assigned) { const c = o.skill.value > 0 ? 'eff-good' : 'eff'; h += `<div class="slot"><span class="name">${o.name}</span><span class="${c}">${o.skill.desc || ''}</span></div>` } h += `</div>` }
      if (s.facilities.training?.assigned) { h += `<div class="facility-card"><h4>🎯 训练室</h4>`; for (const o of s.facilities.training.assigned) { const c = o.skill.value > 0 ? 'eff-good' : 'eff'; h += `<div class="slot"><span class="name">${o.name}</span><span class="${c}">${o.skill.desc || ''}</span></div>` } h += `</div>` }
      h += `<div class="eff-total">生产效率: ${s.efficiency.toFixed(1)} | 💚心情: ${s.moodCost.toFixed(2)}/h ${s.moodCost > 6 ? '⚠️偏高' : ''}</div></div>`
    }
    h += `<div class="eff-total" style="margin-top:4px">两班总效率: ${result.totalEfficiency.toFixed(1)}</div>`
    document.getElementById('scheduleResult').innerHTML = h; document.getElementById('scheduleCard').classList.add('show')
  } catch (e) { alert('排班失败: ' + e.message); console.error(e) } finally { btn.disabled = false; btn.innerHTML = '⚡ 生成排班表' }
}
function showShift(el, id) { document.querySelectorAll('.shift-tab').forEach(t => t.classList.remove('active')); el.classList.add('active'); document.querySelectorAll('[id^="shift"]').forEach(d => d.style.display = 'none'); document.getElementById(id).style.display = 'block' }

// ===== 制造站产物配置 =====
const MF_CATS = ['赤金', '作战记录', '源石碎片', '技巧概要', '仓库', '通用']
function initMfConfig() { const r = document.getElementById('mfConfigRow'); if (!r) return; let c = JSON.parse(localStorage.getItem('ak_mf_config') || 'null') || ['赤金', '作战记录', '源石碎片', '通用', '赤金']; renderMfConfig(c) }
function renderMfConfig(c) { const r = document.getElementById('mfConfigRow'); let h = ''; for (let i = 0; i < c.length; i++) h += '<div class="mf-chip" data-idx="' + i + '" onclick="cycleMfCat(' + i + ')" style="cursor:pointer;padding:3px 8px;border-radius:4px;font-size:11px;background:rgba(15,22,41,.6);border:1px solid rgba(42,58,94,.3);color:#d4a843;letter-spacing:.5px">🏭' + (i + 1) + ' ' + c[i] + '</div>'; r.innerHTML = h }
function cycleMfCat(i) { let c = JSON.parse(localStorage.getItem('ak_mf_config') || 'null') || ['赤金', '作战记录', '源石碎片', '通用', '赤金']; const ci = MF_CATS.indexOf(c[i]); c[i] = MF_CATS[(ci + 1) % MF_CATS.length]; localStorage.setItem('ak_mf_config', JSON.stringify(c)); renderMfConfig(c) }
function refreshMfConfig(n) { let c = JSON.parse(localStorage.getItem('ak_mf_config') || 'null'); if (!c || c.length !== n) { c = []; const d = ['赤金', '作战记录', '源石碎片', '通用', '赤金']; for (let i = 0; i < n; i++) c.push(d[i % d.length] || '通用'); localStorage.setItem('ak_mf_config', JSON.stringify(c)) } renderMfConfig(c) }

document.getElementById('loginBtn').addEventListener('click', login)
document.getElementById('scheduleBtn').addEventListener('click', runSchedule)
document.getElementById('credInput').addEventListener('keydown', e => { if (e.key === 'Enter') login() })
initMfConfig()
